# Edge config — DEFENDED build. Adds hardening headers to the SPA responses.
# The API sets its OWN per-request nonce CSP on /search and /render, so we do
# NOT add a CSP to those proxied locations (avoids clobbering the nonce policy).
server {
  listen 80;
  server_name _;

  # API (JSON) + auth — keep the API's own headers.
  location /api/ { proxy_pass http://api:3000; include /etc/nginx/proxy_common.conf; }

  # Server-rendered sink pages — the API already emits nonce CSP + headers.
  location /search      { proxy_pass http://api:3000; include /etc/nginx/proxy_common.conf; }
  location /render/     { proxy_pass http://api:3000; include /etc/nginx/proxy_common.conf; }
  location = /healthz   { proxy_pass http://api:3000; include /etc/nginx/proxy_common.conf; }

  # SPA — Vite output uses external scripts only, so 'self' is sufficient and
  # blocks any injected inline script/handler (defends the client DOM sink too).
  location / {
    proxy_pass http://web:80;
    include /etc/nginx/proxy_common.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
  }
}
