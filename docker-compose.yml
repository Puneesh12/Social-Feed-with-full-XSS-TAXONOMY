# =============================================================================
# Chirp — full lab stack (report §4.6 / Appendix D)
#
#   nginx (edge, security headers)  ->  api (Express)  ->  db (MongoDB)
#   collector (attacker listener, lab-only)
#
# One code base, two builds. Flip BUILD_MODE in .env (vulnerable | defended)
# and rebuild:  docker compose up --build
# =============================================================================

services:
  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-chirp}
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [chirp_net]

  api:
    build: ./api
    image: chirp/api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BUILD_MODE: ${BUILD_MODE:-vulnerable}
      PORT: ${API_PORT:-3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://db:27017}
      MONGODB_DB: ${MONGODB_DB:-chirp}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-me}
    depends_on:
      db: { condition: service_healthy }
    # Health check so nginx waits for the API to be ready before accepting
    # traffic — prevents 502 Bad Gateway on first `docker compose up`.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz | grep -q 'true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [chirp_net]

  web:
    build:
      context: ./web
      args:
        VITE_BUILD_MODE: ${VITE_BUILD_MODE:-vulnerable}
    image: chirp/web:latest
    restart: unless-stopped
    networks: [chirp_net]

  nginx:
    build: ./nginx
    image: chirp/nginx:latest
    restart: unless-stopped
    # Wait for API to be healthy (not just started) to prevent 502 on first boot
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      BUILD_MODE: ${BUILD_MODE:-vulnerable}
    # entrypoint.sh is baked in via the Dockerfile (with +x); only the
    # templates and shared proxy conf are mounted at runtime so they can
    # be updated without a full rebuild.
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    networks: [chirp_net]

  collector:
    build: ./collector
    image: chirp/collector:latest
    restart: unless-stopped
    # Bound to loopback only: this is the attacker's exfil listener and must
    # never be reachable off the lab host.
    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-9000}:9000"
    networks: [chirp_net]

volumes:
  db_data:

networks:
  chirp_net:
    driver: bridge
