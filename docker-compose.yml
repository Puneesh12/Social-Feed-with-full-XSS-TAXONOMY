# =============================================================================
# Chirp — full lab stack (report §4.6 / Appendix D)
#
#   nginx (edge, security headers)  ->  api (Express)  ->  db (PostgreSQL)
#                                                      \->  redis (sessions)
#   collector (attacker listener, lab-only)
#
# One code base, two builds. Flip BUILD_MODE in .env (vulnerable | defended)
# and rebuild:  docker compose up --build
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chirp}
      # The container superuser; the app itself uses a least-privilege role
      # created by init.sql.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-postgres}
      APP_DB: ${POSTGRES_DB:-chirp}
      APP_USER: ${POSTGRES_USER:-chirp_app}
      APP_PASSWORD: ${POSTGRES_PASSWORD:-chirp_app_pw}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [chirp_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [chirp_net]

  api:
    build: ./api
    environment:
      NODE_ENV: production
      BUILD_MODE: ${BUILD_MODE:-vulnerable}
      PORT: ${API_PORT:-3000}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-chirp}
      POSTGRES_USER: ${POSTGRES_USER:-chirp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chirp_app_pw}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-me}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [chirp_net]

  web:
    build:
      context: ./web
      args:
        VITE_BUILD_MODE: ${VITE_BUILD_MODE:-vulnerable}
    networks: [chirp_net]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api, web]
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      BUILD_MODE: ${BUILD_MODE:-vulnerable}
    # entrypoint picks the vulnerable/defended header set based on BUILD_MODE
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/40-pick-conf.sh:ro
    networks: [chirp_net]

  collector:
    build: ./collector
    # Bound to loopback only: this is the attacker's exfil listener and must
    # never be reachable off the lab host.
    ports:
      - "127.0.0.1:${COLLECTOR_PORT:-9000}:9000"
    networks: [chirp_net]

volumes:
  db_data:

networks:
  chirp_net:
    driver: bridge
